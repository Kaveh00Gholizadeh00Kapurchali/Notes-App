<div class="space-y-5 max-w-xl  mx-auto mt-10 p-6 bg-white rounded-2xl shadow-2xl">
    <h1 class="text-2xl font-bold mb-4 text-center">Notes</h1>

    <input type="text" (input)="search.set($any($event.target).value)" placeholder="Search notes..." class="w-full p-2 border rounded">
    <div class="flex gap-2">    
            <input type="text" #noteInput placeholder="Add Note" class="w-full p-2 border rounded">
            <button class="bg-blue-500 text-white px-4 py-2 rounded" (click)="addNote(noteInput.value)" noteInput.value = "" >Add</button>
    </div>

    <div class="space-y-2">
        @for (note of filteredNotes(); track note; let i = $index) {
            <div class="flex justify-between items-center bg-gray-100 px-4 py-4 rounded-lg">
                <span class="text-gray-700">{{ note }}</span>
            </div>
            <button class="text-red-500 hover:text-red-700" (click)="deleteNote(i)">Delete</button>
        }
    </div>


</div>
